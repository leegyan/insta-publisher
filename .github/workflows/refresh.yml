name: 토큰 갱신
on:
  schedule:
    - cron: '17 21 * * 0'   # 매주 월요일 06:17(한국 시각)
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pynacl==1.5.0
      - env:
          # 계정을 늘리면 accounts.json 과 함께 이 줄을 계정마다 하나씩 더한다
          IG_TOKEN_DON_IN_NUMBERS: ${{ secrets.IG_TOKEN_DON_IN_NUMBERS }}
          IG_TOKEN_MYEOTWI_YA: ${{ secrets.IG_TOKEN_MYEOTWI_YA }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: python3 publish.py refresh
