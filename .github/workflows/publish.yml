name: 인스타그램 게시
on:
  workflow_dispatch: {}   # enqueue.py 가 넣은 즉시 실행한다. 30분 예약 실행은 뺌(Gyan 26.10.30.: 넣으면 바로 게시, 예약 실행은 3~7시간씩 늦었음)
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: queue 가지 받기
        run: |
          if git ls-remote --exit-code --heads origin queue; then
            git clone --depth 1 --branch queue "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _queue
          else
            echo "queue 가지 없음"; exit 0
          fi
      - name: 게시
        if: hashFiles('_queue/posts/**/post.json') != ''
        env:
          # 계정을 늘리면 accounts.json 과 함께 이 줄을 계정마다 하나씩 더한다
          IG_TOKEN_DON_IN_NUMBERS: ${{ secrets.IG_TOKEN_DON_IN_NUMBERS }}
          IG_TOKEN_MYEOTWI_YA: ${{ secrets.IG_TOKEN_MYEOTWI_YA }}
          YT_DON_IN_NUMBERS_CLIENT_SECRET: ${{ secrets.YT_DON_IN_NUMBERS_CLIENT_SECRET }}
          YT_DON_IN_NUMBERS_REFRESH: ${{ secrets.YT_DON_IN_NUMBERS_REFRESH }}
          QUEUE_DIR: _queue
        run: python3 publish.py run
      - name: 게시 기록 저장
        if: always()
        run: |
          git config user.name insta-publisher; git config user.email bot@users.noreply.github.com
          git add 기록/게시기록.jsonl 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "게시 기록" && git push)
