name: 인스타그램 게시
on:
  workflow_dispatch: {}   # enqueue.py 가 넣은 즉시 실행한다. 30분 예약 실행은 뺌(Gyan 26.10.30.: 넣으면 바로 게시, 예약 실행은 3~7시간씩 늦었음)
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: queue 가지 받기
        run: |
          if git ls-remote --exit-code --heads origin queue; then
            git clone --depth 1 --branch queue "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _queue
          else
            echo "queue 가지 없음"; exit 0
          fi
      - name: 게시
        if: hashFiles('_queue/posts/**/post.json') != ''
        env:
          # 계정을 늘리면 accounts.json 과 함께 이 줄을 계정마다 하나씩 더한다
          IG_TOKEN_DON_IN_NUMBERS: ${{ secrets.IG_TOKEN_DON_IN_NUMBERS }}
          IG_TOKEN_MYEOTWI_YA: ${{ secrets.IG_TOKEN_MYEOTWI_YA }}
          IG_TOKEN_HYOGWA_CHECK: ${{ secrets.IG_TOKEN_HYOGWA_CHECK }}
          IG_TOKEN_TES_TED: ${{ secrets.IG_TOKEN_TES_TED }}
          IG_TOKEN_CASHWOOD_LAB: ${{ secrets.IG_TOKEN_CASHWOOD_LAB }}
          YT_DON_IN_NUMBERS_CLIENT_SECRET: ${{ secrets.YT_DON_IN_NUMBERS_CLIENT_SECRET }}
          YT_DON_IN_NUMBERS_REFRESH: ${{ secrets.YT_DON_IN_NUMBERS_REFRESH }}
          YT_HYOGWA_CHECK_REFRESH: ${{ secrets.YT_HYOGWA_CHECK_REFRESH }}   # 앱 키는 YT_DON_IN_NUMBERS_CLIENT_SECRET 를 같이 씀(accounts.json client_secret_prefix)
          QUEUE_DIR: _queue
        run: python3 publish.py run
      - name: 게시 기록 저장
        if: always()
        run: |
          # 게시 기록은 덧붙이기만 한다. 이번 실행이 덧붙인 줄을 따로 두고, 올리기가 거절 · 충돌하면 원격 main 을 새로 받아 그 줄만 다시 덧붙여 올린다(6번).
          #   예전에는 pull --rebase 가 기록 파일 끝 충돌에서 멈춘 채 남아 나머지 재시도도 다 실패했다(26.11.07. 게시 기록 4건 유실)
          git config user.name insta-publisher; git config user.email bot@users.noreply.github.com
          F=기록/게시기록.jsonl
          git diff -U0 HEAD -- "$F" | grep '^+[^+]' | cut -c2- > /tmp/new_lines.jsonl || true
          [ -s /tmp/new_lines.jsonl ] || { echo "새 게시 기록 없음"; exit 0; }
          for i in 1 2 3 4 5 6; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            cat /tmp/new_lines.jsonl >> "$F"
            git add "$F" && git commit -q -m "게시 기록" && git push -q origin HEAD:main && { echo "게시 기록 저장 ($i번째)"; exit 0; }
            sleep $((i * 3))
          done
          echo "게시 기록 저장 6번 실패 — 아래 줄을 수동으로 넣을 것"; cat /tmp/new_lines.jsonl; exit 1
