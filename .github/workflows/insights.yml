name: 릴스 성적표
# 게시하지 않는다. 게시된 릴스의 인사이트를 읽어 암호화한 뒤 기록/성적표/ 에 쌓는다(insights.py 머리 설명).
# 로그에는 수치를 찍지 않는다(공개 저장소)
on:
  schedule:
    - cron: '23 0 * * *'   # 매일 09:23 KST(UTC 00:23). GitHub 예약 실행은 몇 분 늦을 수 있음
  push:
    paths: ['.github/workflows/insights.yml', 'insights.py']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: insights
  cancel-in-progress: false
jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 준비
        run: pip install --quiet cryptography
      - name: 수집 · 암호화
        env:
          # 계정을 늘리면 accounts.json 과 함께 이 줄을 계정마다 하나씩 더한다
          IG_TOKEN_DON_IN_NUMBERS: ${{ secrets.IG_TOKEN_DON_IN_NUMBERS }}
        run: python3 insights.py
      - name: 결과 저장
        run: |
          git config user.name insta-publisher; git config user.email bot@users.noreply.github.com
          git add 기록/성적표
          git diff --cached --quiet && exit 0
          git commit -m "릴스 성적표"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
