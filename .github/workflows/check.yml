name: 토큰 점검
# 게시하지 않는다. 계정마다 GET /me 로 user_id · username 만 읽어 기록/토큰점검.txt 에 적는다. 토큰 값은 출력하지 않는다
on:
  push:
    paths: ['.github/workflows/check.yml', 'accounts.json']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 점검
        env:
          # 계정을 늘리면 accounts.json 과 함께 이 줄을 계정마다 하나씩 더한다
          IG_TOKEN_DON_IN_NUMBERS: ${{ secrets.IG_TOKEN_DON_IN_NUMBERS }}
          IG_TOKEN_MYEOTWI_YA: ${{ secrets.IG_TOKEN_MYEOTWI_YA }}
          IG_TOKEN_HYOGWA_CHECK: ${{ secrets.IG_TOKEN_HYOGWA_CHECK }}
          IG_TOKEN_TES_TED: ${{ secrets.IG_TOKEN_TES_TED }}
          IG_TOKEN_CASHWOOD_LAB: ${{ secrets.IG_TOKEN_CASHWOOD_LAB }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          mkdir -p 기록
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error, datetime
          cfg = json.load(open('accounts.json', encoding='utf-8'))
          sec = dict(os.environ)
          api = 'https://graph.instagram.com/' + cfg.get('api_version', 'v26.0')
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(timespec='seconds')
          lines = [f'점검 시각 {now}']
          for name, acc in cfg['accounts'].items():
              tok = sec.get(acc['token_secret'])
              if not tok:
                  lines.append(f'{name}: 비밀값 {acc["token_secret"]} 없음'); continue
              req = urllib.request.Request(api + '/me?fields=user_id,username')
              req.add_header('Authorization', 'Bearer ' + tok)
              try:
                  r = json.loads(urllib.request.urlopen(req, timeout=30).read())
                  same = '일치' if str(r.get('user_id')) == acc.get('ig_user_id') else f'불일치(accounts.json {acc.get("ig_user_id")})'
                  lines.append(f'{name}: 정상 username={r.get("username")} user_id={r.get("user_id")} ig_user_id {same}')
                  # 권한 시험(읽기만): DM 목록(manage_messages) · 최근 게시물 댓글(manage_comments). 실패 문구만 적고 토큰은 적지 않는다
                  def probe(url):
                      q = urllib.request.Request(api + url); q.add_header('Authorization', 'Bearer ' + tok)
                      try: urllib.request.urlopen(q, timeout=30).read(); return '가능'
                      except urllib.error.HTTPError as e: return f'불가 HTTP {e.code} {e.read().decode(errors="replace")[:160]}'
                  lines.append(f'  {name} DM 목록 읽기(manage_messages): ' + probe('/me/conversations?platform=instagram&limit=1'))
                  try:
                      q = urllib.request.Request(api + '/me/media?fields=id&limit=1'); q.add_header('Authorization', 'Bearer ' + tok)
                      md = json.loads(urllib.request.urlopen(q, timeout=30).read()).get('data', [])
                      lines.append(f'  {name} 댓글 읽기(manage_comments): ' + (probe(f'/{md[0]["id"]}/comments?limit=1') if md else '게시물 없음 — 시험 못 함'))
                  except urllib.error.HTTPError as e:
                      lines.append(f'  {name} 게시물 목록 실패 HTTP {e.code}')
              except urllib.error.HTTPError as e:
                  lines.append(f'{name}: 실패 HTTP {e.code} {e.read().decode(errors="replace")[:300]}')
          gh = sec.get('GH_ADMIN_TOKEN')
          if not gh:
              lines.append('GH_ADMIN_TOKEN(토큰 자동 갱신용): 없음')
          else:
              # 읽기만 함: 비밀값을 암호화할 공개키를 받아 보면 Secrets 권한이 있는지 알 수 있다
              req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/secrets/public-key')
              req.add_header('Authorization', 'Bearer ' + gh); req.add_header('Accept', 'application/vnd.github+json')
              try:
                  urllib.request.urlopen(req, timeout=30).read(); lines.append('GH_ADMIN_TOKEN(토큰 자동 갱신용): 있음, 비밀값 권한 정상')
              except urllib.error.HTTPError as e:
                  lines.append(f'GH_ADMIN_TOKEN(토큰 자동 갱신용): 있음, 권한 확인 실패 HTTP {e.code}')
          open('기록/토큰점검.txt', 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          EOF
      - name: 결과 저장
        run: |
          git config user.name insta-publisher; git config user.email bot@users.noreply.github.com
          git add 기록/토큰점검.txt
          git diff --cached --quiet || (git commit -m "토큰 점검 결과" && git push)
